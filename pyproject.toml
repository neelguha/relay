[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay"
version = "1.0.0"
requires-python = ">= 3.10"
description = "Multi-provider LLM batch prediction library"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "httpx>=0.27",
    "aiofiles>=23.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "tomli>=2.0;python_version<'3.11'",
    "rich>=13.0",
    "typer>=0.12",
    "zstandard>=0.22",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.43"]
openai = ["openai>=1.50", "tiktoken>=0.7"]
google = ["google-generativeai>=0.8", "google-cloud-aiplatform>=1.70"]
xai = ["httpx>=0.27"]
dashboard = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "textual>=0.80"]
parquet = ["pyarrow>=17.0"]
redis = ["redis[hiredis]>=5.0"]
otel = ["opentelemetry-api>=1.28", "opentelemetry-sdk>=1.28", "opentelemetry-exporter-otlp>=1.28"]
hf = ["datasets>=3.0"]
all = ["relay[anthropic,openai,google,xai,dashboard,parquet,redis,hf]"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-vcr>=1.0", "ruff>=0.7", "mypy>=1.12", "hypothesis>=6.0", "pre-commit>=4.0"]

[project.scripts]
relay = "relay.cli:app"

[project.entry-points."relay.providers"]
# Third-party providers register here

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
